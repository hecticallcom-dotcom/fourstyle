<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Fourstyle</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="images/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-bg" aria-hidden="true"><span></span><span></span></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="images/logo.jpeg" alt="Fourstyle">
        <h1 class="auth-welcome">Welcome <em>4Style</em></h1>
        <p class="auth-subtitle">Login to your account</p>
        <p class="auth-tagline">Premium Fashion Accessories</p>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          <i class="fas fa-envelope"></i>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
          <i class="fas fa-lock"></i>
        </div>
        <button type="submit" class="auth-btn-submit">
          <i class="fas fa-sign-in-alt"></i> Login
        </button>
      </form>

      <div class="auth-links">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
      <a class="back-home" href="index.html"><i class="fas fa-arrow-left"></i> Back to Shop</a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/safe-storage.js"></script>
  <script src="js/store.js"></script>
  <script>
    /* seed the admin account (not shown in the UI) */
    (function () {
      const users = JSON.parse(FSLS.getItem('fourstyle_users') || '[]');
      if (!users.find(u => u.email === 'admin@fourstyle.pk')) {
        users.push({ name: 'Admin', email: 'admin@fourstyle.pk', password: 'Fourstyke4545@#$', role: 'admin' });
        FSLS.setItem('fourstyle_users', JSON.stringify(users));
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');

      const users = JSON.parse(FSLS.getItem('fourstyle_users') || '[]');
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        errorMsg.textContent = 'Invalid email or password. Please try again.';
        errorMsg.style.display = 'block';
        return;
      }

      FSLS.setItem('fourstyle_session', JSON.stringify({
        email: user.email, name: user.name, role: user.role
      }));

      try { FSStore.trackLogin(user); } catch (err) {}

      if (user.role !== 'admin' && user.email) {
        try {
          fetch('https://formsubmit.co/ajax/' + encodeURIComponent(user.email), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
              _subject: 'Welcome to Fourstyle — you are logged in',
              message: 'Dear ' + user.name + ',\n\nYou have successfully logged in to Fourstyle.\n\nShop now: https://fourstyle.pk\n\n— Fourstyle Team',
              name: 'Fourstyle'
            })
          }).catch(function () {});
        } catch (err) {}
      }

      window.location.href = user.role === 'admin' ? 'admin.html' : 'index.html';
    });
  </script>
</body>
</html>
